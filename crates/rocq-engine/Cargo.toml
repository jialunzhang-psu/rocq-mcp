[package]
name = "rocq-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Test-only process fault points. This feature is never enabled by normal
# builds and exposes no public API; it exists solely for crash-window tests.
fault-injection = []

[dependencies]
trace-forest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
fs2.workspace = true
walkdir.workspace = true
uuid.workspace = true
nix = { version = "0.30", features = ["signal", "process"] }
base64 = "0.22"
tempfile.workspace = true
