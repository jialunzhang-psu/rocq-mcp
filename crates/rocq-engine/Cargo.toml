[package]
name = "rocq-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Test-only declare-race coordination hook; normal builds expose no hook.
fault-injection = []

[dependencies]
trace-forest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
sha2.workspace = true
uuid.workspace = true
nix = { version = "0.30", features = ["signal", "process"] }
tempfile.workspace = true

[dev-dependencies]
fs2.workspace = true
